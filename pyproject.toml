[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "depth-anything-3"
version = "0.0.0+idol3d.1"
description = "Depth Anything 3"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "addict>=2.4.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "einops>=0.8.2",
    "huggingface_hub>=2.4.0",
    "imageio>=2.38.1",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "omegaconf>=2.4.0",
    "safetensors>=0.8.0",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
export = ["trimesh>=5.2.0", "matplotlib>=3.11.2"]
colmap = ["depth-anything-3[export]", "pycolmap>=4.2.1"]
video = ["imageio[ffmpeg]>=2.38.1", "matplotlib>=3.11.2", "scipy>=1.18.1"]
gs = ["depth-anything-3[video]", "gsplat>=1.5.3", "e3nn>=0.6.0", "plyfile>=1.1.5"]
cli = ["depth-anything-3[export,colmap,video]", "typer>=0.29.1", "fastapi>=0.162.5", "uvicorn>=0.54.0", "requests>=2.34.2"]
app = ["depth-anything-3[cli]", "gradio>=5", "pillow_heif>=1.8.1"]
bench = ["depth-anything-3[export]", "open3d>=0.20.0", "scipy>=1.18.1", "scikit-learn", "plyfile>=1.1.5"]
xformers = ["xformers>=0.0.35"]
dev = ["pytest>=9.2.0", "packaging>=26.3", "pre-commit>=4.7.0"]
all = ["depth-anything-3[app,gs,bench,xformers]"]


[project.scripts]
da3 = "depth_anything_3.cli:app"

[project.urls]
Homepage = "https://github.com/ByteDance-Seed/Depth-Anything-3"
Repository = "https://github.com/star4277/Depth-Anything-3"

[tool.hatch.build.targets.wheel]
packages = ["src/depth_anything_3"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/src/depth_anything_3",
  "/tests",
  "/docs/IDOL3D_FORK.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
plugins = ["jaxtyping.mypy_plugin"]

[tool.black]
line-length = 99
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
  | \.git
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["bson","cruise","cv2","dataloader","diffusers","omegaconf","tensorflow","torch","torchvision","transformers","gsplat"]
known_first_party = ["common", "data", "models", "projects"]
sections = ["FUTURE","STDLIB","THIRDPARTY","FIRSTPARTY","LOCALFOLDER"]
skip_gitignore = true
line_length = 99
no_lines_before="THIRDPARTY"
